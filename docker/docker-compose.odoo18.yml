# Optional Odoo 18 Community stack for M2 multi-version gates.
# Ports offset from primary 19 stack (8069 / 5432 mapped as 5433 app-db).
# Usage (from repo root):
#   docker compose -p odoo18 -f docker/docker-compose.odoo18.yml up -d
#   ./docker/init-db-18.sh
#   ODOO_URL=http://127.0.0.1:8070 ODOO_DB=odoo18_dev pytest …/test_integration_odoo18.py

services:
  db18:
    image: postgres:15
    container_name: odoo-custom-db18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo18-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  odoo18:
    image: odoo:18
    container_name: odoo-custom-odoo18
    depends_on:
      db18:
        condition: service_healthy
    ports:
      - "8070:8069"
    environment:
      HOST: db18
      USER: odoo
      PASSWORD: odoo
    volumes:
      - odoo18-web-data:/var/lib/odoo
      - odoo18-addons:/mnt/extra-addons
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/login', timeout=5)\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  odoo18-db-data:
  odoo18-web-data:
  odoo18-addons:

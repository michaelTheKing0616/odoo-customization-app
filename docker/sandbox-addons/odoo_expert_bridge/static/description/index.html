<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Odoo Expert Bridge</title>
  </head>
  <body>
    <h1>Odoo Expert Bridge</h1>
    <p>
      Adds a Settings menu entry that opens the No-Code Customization app Expert panel
      (<code>?expert=1</code>) with optional record context.
    </p>
    <p>
      After install, set system parameter
      <strong>expert_bridge.base_url</strong> to your web app URL (e.g.
      <code>http://localhost:3000</code>).
    </p>
  </body>
</html>

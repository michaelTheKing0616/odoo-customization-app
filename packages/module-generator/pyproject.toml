[project]
name = "module-generator"
version = "0.1.0"
description = "Jinja2 Odoo 19 addon zip generator"
requires-python = ">=3.12"
dependencies = [
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/module_generator"]

[tool.hatch.build.targets.wheel.force-include]
"src/module_generator/vendor/zxing-browser.min.js" = "module_generator/vendor/zxing-browser.min.js"

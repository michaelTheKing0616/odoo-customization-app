[pytest]
markers =
    integration: needs local Odoo 16–19 (+ app-db for apps/api)
    no_app_db: unit tests that must not open app Postgres
    odoo_live: real disposable Odoo 17-20 containers (ODOO_LIVE=1); skipped by default
    sandbox: slow ephemeral Docker sandbox (PR-D/E prove); excluded from fast CI
    slow: long-running sandbox prove suite; excluded from fast CI

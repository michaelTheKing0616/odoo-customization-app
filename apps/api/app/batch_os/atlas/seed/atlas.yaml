# Config Atlas seed — ingenium Batch OS
# status: complete | stub | planned
version: 1
classes:
  - id: accounting
    title: Accounting
    status: complete
    blurb: Journals, CoA, taxes, FY, lock dates, opening balances, currency, payment terms.
    intents:
      - id: accounting.journals
        title: Journals
        models: [account.journal]
        risk: L1
        recipe: null
        status: complete
        blurb: Chart of journals (sale, purchase, bank, cash, general, opening).
      - id: accounting.coa
        title: Chart of accounts
        models: [account.account]
        risk: L1
        recipe: null
        status: complete
        blurb: Account codes and types via public RPC / ingest CoA path.
      - id: accounting.taxes
        title: Taxes
        models: [account.tax]
        risk: L2
        recipe: null
        status: complete
        blurb: Align to l10n taxes — never invent account.tax from scratch.
      - id: accounting.fy
        title: Fiscal year / periods
        models: [account.fiscal.year, res.company]
        risk: L2
        recipe: null
        status: complete
        blurb: Fiscal calendar awareness via company + lock fields.
      - id: accounting.lock_dates
        title: Lock dates
        models: [res.company]
        risk: L3
        recipe: accounting.lock_dates
        status: complete
        blurb: Period / FY / tax lock dates — confirm required.
      - id: accounting.opening_balances
        title: Opening balances
        models: [account.move, account.journal]
        risk: L1
        recipe: accounting.opening_balances
        status: complete
        blurb: Opening TB → draft move on Opening journal (never raw AML invent).
      - id: accounting.currency
        title: Currency
        models: [res.currency, res.company]
        risk: L2
        recipe: null
        status: complete
        blurb: Company currency (blocked once journals/moves exist).
      - id: accounting.payment_terms
        title: Payment terms
        models: [account.payment.term]
        risk: L1
        recipe: null
        status: complete
        blurb: Net 15/30 packs via config recipes / master data.
      - id: accounting.journal_batch
        title: Journal batch
        models: [account.move, account.move.line, account.journal, account.account]
        risk: L1
        recipe: accounting.journal_batch
        status: complete
        blurb: CSV/XLSX batch into balanced draft journal entries.


# Config Atlas seed — ingenium Batch OS
# status: complete | stub | planned
version: 1
classes:
  - id: accounting
    title: Accounting
    status: complete
    blurb: Journals, CoA, taxes, FY, lock dates, opening balances, currency, payment terms, journal batch.
    intents:
      - id: accounting.journals
        title: Journals
        models: [account.journal]
        risk: L1
        recipe: null
        status: complete
        blurb: Chart of journals (sale, purchase, bank, cash, general, opening).
      - id: accounting.coa
        title: Chart of accounts
        models: [account.account]
        risk: L1
        recipe: null
        status: complete
        blurb: Account codes and types via public RPC / ingest CoA path.
      - id: accounting.taxes
        title: Taxes
        models: [account.tax]
        risk: L2
        recipe: accounting.tax_pack
        status: complete
        blurb: Tax pack via RPC (NG/generic starter). Prefer l10n localization.
      - id: accounting.fy
        title: Fiscal year / periods
        models: [account.fiscal.year, res.company]
        risk: L2
        recipe: accounting.fiscal_year
        status: complete
        blurb: Fiscal year create/report via account.fiscal.year when present.
      - id: accounting.lock_dates
        title: Lock dates
        models: [res.company]
        risk: L3
        recipe: accounting.lock_dates
        status: complete
        blurb: Period / FY / tax lock dates — confirm required.
      - id: accounting.opening_balances
        title: Opening balances
        models: [account.move, account.journal]
        risk: L1
        recipe: accounting.opening_balances
        status: complete
        blurb: Opening TB → draft move on Opening journal (never raw AML invent).
      - id: accounting.currency
        title: Currency
        models: [res.currency, res.company]
        risk: L2
        recipe: settings.currency
        status: complete
        blurb: Activate currencies; company currency change guarded when moves exist.
      - id: accounting.payment_terms
        title: Payment terms
        models: [account.payment.term]
        risk: L1
        recipe: settings.payment_terms
        status: complete
        blurb: Net 15/30/45 packs via settings.payment_terms recipe.
      - id: accounting.journal_batch
        title: Journal batch
        models: [account.move, account.move.line, account.journal, account.account]
        risk: L1
        recipe: accounting.journal_batch
        status: complete
        blurb: CSV/XLSX batch into balanced draft journal entries.

  - id: master_data
    title: Master data
    status: complete
    blurb: Partners and products CSV/XLSX via Batch OS runner (map → validate → dry-run → apply).
    intents:
      - id: master.partners
        title: Partners
        models: [res.partner]
        risk: L1
        recipe: master_data.partners_batch
        status: complete
        blurb: Partner CSV create/update; dedup VAT/email/ref/name. Preview ≠ written.
      - id: master.products
        title: Products
        models: [product.template, product.product]
        risk: L1
        recipe: master_data.products_batch
        status: complete
        blurb: Product CSV create/update; dedup default_code/barcode/name.
      - id: master.uom
        title: Units of measure
        models: [uom.uom, uom.category]
        risk: L1
        recipe: null
        status: complete
        blurb: UoM resolved during product batch when column present; Import for full packs.

  - id: document_batch
    title: Document batch
    status: complete
    blurb: Invoices, bills, payment matching via Batch OS runner.
    intents:
      - id: docs.invoices
        title: Invoices & bills
        models: [account.move, res.partner, product.product, account.tax]
        risk: L1
        recipe: document_batch.invoices
        status: complete
        blurb: CSV/XLSX → draft out_invoice / in_invoice. Optional L2 post.
      - id: docs.payments
        title: Payment matching
        models: [account.payment, account.payment.register, account.move]
        risk: L2
        recipe: document_batch.payments
        status: complete
        blurb: Register payments against open moves. Dry-run first. Preview ≠ posted.
      - id: docs.orders
        title: Order batch
        models: [sale.order, purchase.order]
        risk: L1
        recipe: null
        status: stub
        blurb: Sales/purchase order batch — planned after invoice layer.
      - id: docs.journal
        title: Journal entries
        models: [account.move]
        risk: L1
        recipe: accounting.journal_batch
        status: complete
        blurb: Cross-link to accounting.journal_batch on the same runner.

  - id: settings
    title: Settings
    status: complete
    blurb: Payment terms, pricelists, currency, sequences — runnable recipes.
    intents:
      - id: settings.board
        title: Settings board
        models: [account.payment.term, res.currency, ir.sequence, product.pricelist]
        risk: L2
        recipe: settings.board_apply
        status: complete
        blurb: Composite pack — terms + currency + sequences + pricelists.
      - id: settings.payment_terms
        title: Payment terms
        models: [account.payment.term]
        risk: L1
        recipe: settings.payment_terms
        status: complete
        blurb: Immediate / 15 / 30 / 45 day packs.
      - id: settings.pricelists
        title: Pricelists
        models: [product.pricelist]
        risk: L1
        recipe: settings.pricelists
        status: complete
        blurb: Basic pricelist create when Sales model present.
      - id: settings.currency
        title: Currency basics
        models: [res.currency, res.company]
        risk: L2
        recipe: settings.currency
        status: complete
        blurb: Activate currencies; never force company currency when moves exist.
      - id: settings.sequences
        title: Sequences
        models: [ir.sequence]
        risk: L1
        recipe: settings.sequences
        status: complete
        blurb: List sequences; optional prefix updates via public RPC.

  - id: access_company
    title: Access & company
    status: complete
    blurb: Users, groups, multi-company link via public RPC (L2 caution).
    intents:
      - id: access.users
        title: Users & groups
        models: [res.users, res.groups]
        risk: L2
        recipe: access_company.users
        status: complete
        blurb: Create/invite users and assign groups. Dry-run first.
      - id: access.multi_company
        title: Multi-company
        models: [res.company, res.users]
        risk: L2
        recipe: access_company.multi_company
        status: complete
        blurb: List companies; link users to company_ids via public RPC.

  - id: automation
    title: Automation
    status: complete
    blurb: Cron enable/disable via ir.cron; base.automation pointer to Automation Manager.
    intents:
      - id: auto.cron
        title: Cron / scheduled actions
        models: [ir.cron]
        risk: L2
        recipe: automation.cron_pack
        status: complete
        blurb: List + toggle ir.cron. No silent cron invent.
      - id: auto.base
        title: Base automations
        models: [base.automation]
        risk: L2
        recipe: automation.base
        status: complete
        blurb: Catalog pointer to Automation Manager — no fake RPC.

  - id: ui_studio
    title: UI / Studio
    status: complete
    blurb: Views and menus — App Studio owns generation (catalog pointers).
    intents:
      - id: ui.views
        title: Views
        models: [ir.ui.view]
        risk: L1
        recipe: ui_studio.view_pack
        status: complete
        blurb: Pointer to App Studio / View Designer.
      - id: ui.menus
        title: Menus
        models: [ir.ui.menu]
        risk: L1
        recipe: ui_studio.menus
        status: complete
        blurb: Pointer to App Studio for ir.ui.menu packs.

  - id: housekeeping
    title: Housekeeping
    status: complete
    blurb: Attachment cleanup and partner archive/dedupe dry-run.
    intents:
      - id: house.attachments
        title: Attachment cleanup
        models: [ir.attachment]
        risk: L2
        recipe: housekeeping.attachments
        status: complete
        blurb: List candidates; archive/unlink only when ids provided.
      - id: house.dedupe
        title: Deduplicate partners
        models: [res.partner]
        risk: L2
        recipe: housekeeping.partner_dedupe
        status: complete
        blurb: Dry-run VAT/email clusters; optional archive of extras.

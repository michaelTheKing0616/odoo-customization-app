# Explicit unsupported intents — honest can_handle:false (never invent features).
unsupported:
  - id: sms.blast
    keywords: ["sms blast", "send sms", "text blast", "twilio", "whatsapp blast"]
    message: "ingenium does not send SMS/WhatsApp blasts. Use an external messaging provider; we can help with partner lists via Master data batch or Bulk Suite."
  - id: email.marketing
    keywords: ["email blast", "mailchimp", "marketing campaign", "newsletter blast"]
    message: "ingenium does not run email marketing campaigns. Partner lists can be prepared via Master data batch; outbound marketing stays outside this app."
  - id: payroll
    keywords: ["run payroll", "payslip", "salary process"]
    message: "Payroll processing is not a shipped ingenium surface. Configure HR apps on Odoo separately; Atlas/recipes do not cover payslips."
  - id: pos.hardware
    keywords: ["configure pos printer", "barcode scanner driver", "cash drawer"]
    message: "POS hardware drivers are outside ingenium. We route app/config work only — not device firmware."

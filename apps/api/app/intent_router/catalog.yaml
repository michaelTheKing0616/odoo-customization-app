# ingenium Intent → feature catalog (static surfaces).
# Atlas intents + Batch recipes are merged at load time — keep this for app routes
# that are not Atlas-backed, plus keyword boosts / deep-link overrides.
version: 1
honesty: "Preview ≠ posted. Completeness ≠ Cert ≠ Autopilot. ingenium only routes to shipped features."

# recipe_id → deep link template (relative to /connections/{id}/)
recipe_routes:
  accounting.journal_batch: "journal?tab=batch"
  accounting.opening_balances: "journal?tab=batch"
  accounting.lock_dates: "config"
  accounting.tax_pack: "config"
  accounting.fiscal_year: "config"
  document_batch.invoices: "journal?tab=invoices"
  document_batch.payments: "journal?tab=invoices"
  master_data.partners_batch: "journal?tab=master"
  master_data.products_batch: "journal?tab=master"
  settings.board_apply: "config"
  settings.payment_terms: "config"
  settings.pricelists: "config"
  settings.currency: "config"
  settings.sequences: "config"
  access_company.users: "access"
  access_company.multi_company: "config"
  automation.cron_pack: "cron-manager"
  automation.base: "automations"
  ui_studio.view_pack: "designer"
  ui_studio.menus: "menus"
  housekeeping.attachments: "housekeeping"
  housekeeping.partner_dedupe: "housekeeping"

features:
  - id: journal.batch
    title: Journal batch
    blurb: Upload CSV/XLSX journal entries into balanced draft account.move rows. Preview ≠ posted.
    route: "journal?tab=batch"
    source: batch_os
    status: complete
    can_handle: true
    recipe: accounting.journal_batch
    keywords:
      - journal entr
      - journal batch
      - upload journal
      - bulk journal
      - general ledger
      - gl entries
      - gl batch
      - accounting entries
      - draft moves
      - account.move
      - opening balance
      - trial balance
    weight: 1.2

  - id: journal.invoices
    title: Invoice & bill batch
    blurb: CSV → draft customer invoices / vendor bills (account.move). Preview ≠ posted.
    route: "journal?tab=invoices"
    source: batch_os
    status: complete
    can_handle: true
    recipe: document_batch.invoices
    keywords:
      - invoice
      - invoices
      - vendor bill
      - bills
      - customer invoice
      - document batch
      - upload invoices
      - bulk invoices
      - payment matching
      - payments batch

[project]
name = "odoo-custom-api"
version = "0.1.0"
description = "FastAPI backend for the no-code Odoo customization platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.9",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "odoo-client",
  "module-generator",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "cryptography>=44",
  "openpyxl>=3.1",
  "pypdf>=6.16.1",
  "pillow>=11.0",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "authlib>=1.4",
  "pyyaml>=6",
  # Runtime: OAuth callbacks, ingest vision OCR, outbound HTTP probes
  "httpx>=0.28",
  "pypdfium2>=4.30",
  "segno>=1.6.6",
]

[project.optional-dependencies]
stripe = [
  "stripe>=11.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
  "mypy>=1.15",
]
# Local MiniLM embeddings for domain-pack RAG (Apple Silicon friendly)
ai-rag = [
  "sentence-transformers>=3.0",
]

[tool.uv.sources]
odoo-client = { workspace = true }
module-generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",  # Deterministic rerun passes `-p no:randomly`.
]

[tool.pytest.ini_options]
markers = [
    "integration: needs local Odoo 16–19 (+ app-db for apps/api)",
    "no_app_db: unit tests that must not open app Postgres",
    "odoo_live: real disposable Odoo 17-20 containers (ODOO_LIVE=1); skipped by default",
    "sandbox: slow ephemeral Docker sandbox (PR-D/E prove); excluded from fast CI",
    "slow: long-running sandbox prove suite; excluded from fast CI",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
